app-id: com.netxms.NetXMSClient62
runtime: org.gnome.Platform
runtime-version: "50"
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.openjdk17
command: netxms-client.sh
finish-args:
  - --share=ipc
  - --socket=x11
  - --share=network
  - --persist=.nxmc4
  - --persist=.swt
modules:
  - name: openjdk-17
    buildsystem: simple
    build-commands:
      - /usr/lib/sdk/openjdk17/install.sh
  - name: netxms-client
    buildsystem: simple
    build-commands:
      - install -Dm755 netxms-client.sh /app/bin/netxms-client.sh
      - install -Dm644 nxmc.jar /app/bin/nxmc.jar
      - install -T -Dm644 netxms.svg
        /app/share/icons/hicolor/scalable/apps/${FLATPAK_ID}.svg
      - install -t /app/share/applications/ -Dm644 ${FLATPAK_ID}.desktop
      - install -t /app/share/metainfo/ -Dm644 ${FLATPAK_ID}.metainfo.xml
    sources:
      - type: file
        url: https://netxms.org/download/releases/6.2/nxmc-6.2.2-standalone.jar
        sha256: 18aa0488c832e7ed23101a6c21ae2ab172b2c33694e38446db36641664d5b982
        dest-filename: nxmc.jar
        x-checker-data:
          type: html
          url: https://netxms.com/downloads/
          version-pattern: "NetXMS Version [0-9.]+"
          url-template: >-
            https://netxms.com/download/releases/$major.$minor/nxmc-$version-standalone.jar
      - type: file
        path: netxms-client.sh
      - type: file
        url: https://raw.githubusercontent.com/netxms/appstream/ad11fa500ea1ff16f61425dad18b8105c2e99175/6.2/com.netxms.NetXMSClient62.desktop
        sha256: cd98bd1db2eef15e03fe34e0cf4df54466242b6275f2125c6b29bd5f59cd4e57
      - type: file
        url: https://raw.githubusercontent.com/netxms/appstream/ce3f7ef7d72da01d078245fd9a32ce40ae2b99f4/6.2/com.netxms.NetXMSClient62.metainfo.xml
        sha256: 59e125e2bc5c07c48f077d48a9505bbd1ead851955f264eb94d1922ce70f7e07
      - type: file
        url: https://raw.githubusercontent.com/netxms/appstream/ad11fa500ea1ff16f61425dad18b8105c2e99175/6.2/netxms-icon.svg
        sha256: 2be6744ec2dfad5dbfd76c66eb161136bb7294736ebb053dc8f901881c5409bc
        dest-filename: netxms.svg
